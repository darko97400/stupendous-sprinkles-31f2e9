<style>
:root{--red:#d71920;--blue:#174a76;--dark:#132238;--bg:#f4f7fb;--line:#d7e1eb;--ok:#12804d;--bad:#bd2d2d}
*{box-sizing:border-box}html{font-size:16px}body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--dark);line-height:1.55}
button{font:inherit}header{position:sticky;top:0;z-index:20;background:linear-gradient(120deg,#9e0d15,var(--red));color:#fff;padding:16px 20px;box-shadow:0 3px 12px #0003}
.header-inner{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;gap:12px;align-items:center}.leaf{font-size:32px}.brand h1{font-size:20px;margin:0}.brand p{margin:0;opacity:.88;font-size:13px}
.lang-switch{display:flex;gap:4px;background:#fff2;padding:4px;border-radius:10px}.lang-switch button{border:0;background:transparent;color:#fff;padding:8px 13px;border-radius:8px;font-weight:800;cursor:pointer}.lang-switch button.active{background:white;color:var(--red)}
.layout{max-width:1240px;margin:18px auto;display:grid;grid-template-columns:245px minmax(0,1fr);gap:16px;padding:0 12px}
.sidebar,.card{background:white;border-radius:15px;box-shadow:0 5px 20px #19324f12}.sidebar{padding:10px;height:max-content;position:sticky;top:94px}
.nav-btn{display:flex;width:100%;min-height:46px;border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:9px;font-weight:750;color:var(--dark);cursor:pointer;touch-action:manipulation;align-items:center;gap:10px}.nav-icon{display:block;flex:0 0 auto;font-size:22px;line-height:1}.nav-label{display:block;min-width:0}.nav-btn:hover,.nav-btn.active{background:#eaf3fb;color:var(--blue)}.nav-btn.active{box-shadow:inset 0 0 0 2px #174a7622}
.card{padding:22px;margin-bottom:16px}.hero{border-left:5px solid var(--red);background:linear-gradient(135deg,#fff,#f5faff)}
h2{margin-top:0;color:var(--blue)}h3{color:#28577f}p{max-width:920px}.muted{color:#67788b}
.badge{display:inline-block;background:#edf4fb;color:var(--blue);padding:4px 9px;border-radius:99px;font-size:12px;font-weight:800}.badge.done{background:#e4f6ed;color:var(--ok)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.btn{min-height:50px;border:0;background:var(--blue);color:white;border-radius:11px;padding:11px 17px;font-weight:850;cursor:pointer;touch-action:manipulation}.btn.red{background:var(--red)}.btn.green{background:var(--ok)}.btn.light{background:#edf4fb;color:var(--blue)}.btn:disabled{opacity:.38;cursor:not-allowed}.next-btn.ready{box-shadow:0 0 0 4px #174a7625}
.progress{height:11px;background:#e5eaf0;border-radius:20px;overflow:hidden}.progress span{height:100%;display:block;background:linear-gradient(90deg,var(--red),#ff7378)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{text-align:center;border:1px solid var(--line);border-radius:12px;padding:13px}.stat b{font-size:25px;display:block}
.lesson-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.lesson-card{display:block;width:100%;min-height:205px;text-align:left;background:white;color:inherit;border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;touch-action:manipulation}.lesson-card:hover{box-shadow:0 8px 22px #174a7618;transform:translateY(-2px)}.lesson-icon{font-size:40px}
.answer-list{display:grid;gap:11px}.answer-btn{position:relative;display:block;width:100%;min-height:62px;text-align:left;background:white;color:var(--dark);border:2px solid var(--line);border-radius:12px;padding:15px 18px;font-weight:650;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.answer-btn:hover:not(:disabled){border-color:#719bc0;background:#f1f8fe}.answer-btn.selected{border-color:var(--blue);background:#e7f2fb;box-shadow:0 0 0 3px #174a7620}.answer-btn.selected::after{content:"✓";position:absolute;right:17px;color:var(--blue);font-size:21px}.answer-btn.correct{border-color:var(--ok);background:#e8f7ef}.answer-btn.wrong{border-color:var(--bad);background:#ffeded}.answer-btn:disabled{cursor:default;opacity:1}
.question{font-size:21px;font-weight:850;margin:18px 0}.feedback{padding:14px;border-radius:11px;margin-top:14px}.feedback.ok{background:#e8f7ef;color:#0b6139}.feedback.bad{background:#ffeded;color:#842020}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px}.topic-btn{min-height:54px;border:2px solid var(--line);background:white;border-radius:11px;padding:10px;text-align:left;font-weight:750;cursor:pointer;touch-action:manipulation}.topic-btn:hover,.topic-btn.active{border-color:var(--blue);background:#eaf3fb;color:var(--blue)}
.exam-head{display:flex;align-items:center;justify-content:space-between}.timer{font-size:24px;font-weight:900;color:var(--red)}.q-nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:15px}.q-number{width:39px;height:39px;border:1px solid var(--line);background:white;border-radius:8px;cursor:pointer}.q-number.answered{background:#ddecf8}.q-number.current{outline:3px solid #82b0d7}
.review-item{border:1px solid var(--line);border-radius:12px;padding:15px;margin:11px 0}.correct-review{border-left:5px solid var(--ok)}.wrong-review{border-left:5px solid var(--bad)}.big-score{font-size:50px;font-weight:950}
.memory,.warning{padding:13px;border-radius:10px;margin:14px 0}.memory{background:#fff4c8;border-left:4px solid #d39a0e}.warning{background:#ffe9e9;border-left:4px solid var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px;margin:12px 0}th{background:var(--blue);color:white;text-align:left}th,td{border:1px solid var(--line);padding:8px}.source{border-top:1px solid var(--line);padding-top:12px;margin-top:18px;color:#68788a;font-size:12px}hr{border:0;border-top:1px solid var(--line);margin:22px 0}
@media(max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static;overflow:auto}.sidebar nav{display:flex;gap:4px}.nav-btn{min-width:max-content}.stats{grid-template-columns:repeat(2,1fr)}.answer-btn{min-height:66px;font-size:16px}.header-inner{align-items:flex-start}.brand p{display:none}}

.format-badge{background:#fff1d7;color:#8b5700;margin-left:6px}.dynamic-badge{background:#ffe8e8;color:#9a2626;margin-left:6px}
.bank-card{border-top:4px solid var(--blue)}
@media(max-width:820px){
  body{padding-bottom:calc(165px + env(safe-area-inset-bottom));scroll-padding-bottom:calc(165px + env(safe-area-inset-bottom))}
  header{padding:12px 14px}
  .layout{display:block;margin:10px auto;padding:0 9px 55px}
  .sidebar{
    position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;
    border-radius:18px 18px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    box-shadow:0 -5px 20px #0002;background:#fff;border-top:1px solid #d7e1eb
  }
  .sidebar nav{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;overflow:visible}
  .nav-btn{min-width:0;min-height:82px;text-align:center;padding:7px 2px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--dark)}
  .nav-icon{display:block;font-size:40px;line-height:1;filter:none;opacity:1}
  .nav-label{display:block;font-size:9px;line-height:1.05;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-btn.active .nav-icon{transform:scale(1.08)}
  .card{padding:17px 14px;border-radius:13px;margin-bottom:18px;overflow:visible}
  .lesson-grid{grid-template-columns:1fr}
  .lesson-card{min-height:0;padding:15px}
  .topic-grid{grid-template-columns:1fr 1fr}
  .topic-btn{min-height:58px;text-align:center}
  .answer-btn{min-height:68px;padding:17px 16px;font-size:16px}
  .question{font-size:20px;margin:16px 0}
  .actions{gap:8px}
  .actions .next-btn{display:block;width:100%;min-height:60px;font-size:18px;margin-top:4px}
  .actions{display:grid;grid-template-columns:1fr;gap:9px}
  .actions .btn{width:100%}
  .q-nav{overflow-x:auto;flex-wrap:nowrap;padding-bottom:5px}
  .q-number{flex:0 0 42px;width:42px;height:42px}
  .stats{grid-template-columns:1fr 1fr}
  table{font-size:12px}
}


.reward-summary{border-top:4px solid #d59b12}.reward-summary-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.reward-summary-head>div{display:flex;align-items:center;gap:12px}.reward-summary-head small{display:block;color:#68788a}.reward-level-icon{font-size:38px}.readiness-progress span{background:linear-gradient(90deg,#168451,#45bd7b)}
.reward-toast{position:fixed;top:88px;left:50%;z-index:100;transform:translate(-50%,-150%);background:#132238;color:white;padding:13px 20px;border-radius:99px;font-weight:850;box-shadow:0 8px 24px #0004;transition:transform .25s ease;max-width:90%;text-align:center}.reward-toast.show{transform:translate(-50%,0)}
.rewards-hero{text-align:center}.reward-trophy{font-size:64px}.level-title{font-size:28px;font-weight:900;color:#174a76}.xp-progress span{background:linear-gradient(90deg,#d59b12,#ffd45f)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}.achievement{min-height:145px;border:2px solid var(--line);border-radius:14px;padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.achievement-icon{font-size:38px}.achievement small{color:#68788a}.achievement.unlocked{border-color:#d59b12;background:#fff9e8;box-shadow:0 5px 14px #d59b1220}.achievement.locked{filter:grayscale(1);opacity:.58}
@media(max-width:820px){.reward-summary-head{align-items:flex-start}.reward-summary-head .btn{width:auto}.reward-toast{top:72px}.badge-grid{grid-template-columns:1fr 1fr}.achievement{min-height:130px;padding:10px}.reward-stats{grid-template-columns:1fr 1fr}}
.mobile-bottom-spacer{display:none}@media(max-width:820px){.mobile-bottom-spacer{display:block;height:55px}}

<script>
const DATA = {"lessons": [{"id": "rights", "icon": "⚖️", "title": {"fr": "Droits et responsabilités", "en": "Rights and Responsibilities"}, "summary": {"fr": "Libertés fondamentales, Charte, égalité et devoirs civiques.", "en": "Fundamental freedoms, the Charter, equality and civic duties."}, "content": {"fr": "<h2>Droits, libertés et responsabilités</h2>\n<p>Le Canada repose sur la <strong>primauté du droit</strong> : les citoyens, les gouvernements, les policiers, les politiciens et les juges sont tous soumis à la loi.</p>\n<h3>Les quatre libertés fondamentales</h3>\n<ul><li>Liberté de conscience et de religion</li><li>Liberté de pensée, de croyance, d’opinion et d’expression, y compris la presse</li><li>Liberté de réunion pacifique</li><li>Liberté d’association</li></ul>\n<h3>Autres droits</h3>\n<ul><li>Droits démocratiques : voter et se présenter à une élection</li><li>Liberté de circulation : vivre et travailler partout au Canada, entrer et sortir du pays</li><li>Égalité du français et de l’anglais dans les institutions fédérales</li><li>Droits ancestraux et issus de traités des peuples autochtones</li><li>Égalité entre les femmes et les hommes</li></ul>\n<h3>Responsabilités</h3>\n<ul><li>Respecter les lois</li><li>Subvenir à ses besoins et à ceux de sa famille</li><li>Faire partie d’un jury lorsqu’on est convoqué</li><li>Voter</li><li>Aider sa communauté</li><li>Protéger le patrimoine et l’environnement</li></ul>\n<div class=\"memory\"><b>Piège :</b> le service militaire n’est pas obligatoire au Canada.</div>", "en": "<h2>Rights, Freedoms and Responsibilities</h2>\n<p>Canada is based on the <strong>rule of law</strong>: citizens, governments, police officers, politicians and judges are all subject to the law.</p>\n<h3>The four fundamental freedoms</h3>\n<ul><li>Freedom of conscience and religion</li><li>Freedom of thought, belief, opinion and expression, including freedom of the press</li><li>Freedom of peaceful assembly</li><li>Freedom of association</li></ul>\n<h3>Other rights</h3>\n<ul><li>Democratic rights: voting and running for office</li><li>Mobility rights: living and working anywhere in Canada, entering and leaving Canada</li><li>Equal status of English and French in federal institutions</li><li>Aboriginal and treaty rights</li><li>Equality of women and men</li></ul>\n<h3>Responsibilities</h3>\n<ul><li>Obeying the law</li><li>Taking responsibility for oneself and one’s family</li><li>Serving on a jury when called</li><li>Voting</li><li>Helping the community</li><li>Protecting Canada’s heritage and environment</li></ul>\n<div class=\"memory\"><b>Common trap:</b> military service is not compulsory in Canada.</div>"}}, {"id": "identity", "icon": "🧑‍🤝‍🧑", "title": {"fr": "Identité canadienne et peuples autochtones", "en": "Canadian Identity and Indigenous Peoples"}, "summary": {"fr": "Premières Nations, Inuits, Métis, Français, Britanniques et diversité.", "en": "First Nations, Inuit, Métis, French, British and diversity."}, "content": {"fr": "<h2>Qui sommes-nous, les Canadiens?</h2>\n<p>Le guide présente trois grands peuples fondateurs : <strong>les peuples autochtones, les Français et les Britanniques</strong>.</p>\n<h3>Peuples autochtones</h3>\n<ul><li><b>Premières Nations</b> : peuples autochtones autres que les Inuits et les Métis</li><li><b>Inuits</b> : « le peuple » en inuktitut; vivent principalement dans l’Arctique</li><li><b>Métis</b> : peuple distinct d’origines autochtones et européennes; langue traditionnelle : le michif</li></ul>\n<p>La Proclamation royale de 1763 a établi une base pour la négociation des traités. Le gouvernement fédéral a présenté en 2008 des excuses officielles aux anciens élèves des pensionnats.</p>\n<h3>Langues et diversité</h3>\n<p>Le français et l’anglais sont les deux langues officielles. Le Nouveau-Brunswick est la seule province officiellement bilingue. Le Canada est une société multiculturelle régie par des lois communes.</p>", "en": "<h2>Who We Are</h2>\n<p>The guide describes three main founding peoples: <strong>Indigenous peoples, the French and the British</strong>.</p>\n<h3>Indigenous peoples</h3>\n<ul><li><b>First Nations</b>: Indigenous peoples other than Inuit and Métis</li><li><b>Inuit</b>: means “the people” in Inuktitut; mainly live in the Arctic</li><li><b>Métis</b>: a distinct people of Indigenous and European ancestry; traditional language: Michif</li></ul>\n<p>The Royal Proclamation of 1763 established a basis for treaty negotiations. In 2008, the federal government formally apologized to former residential school students.</p>\n<h3>Languages and diversity</h3>\n<p>English and French are Canada’s two official languages. New Brunswick is the only officially bilingual province. Canada is a multicultural society governed by common laws.</p>"}}, {"id": "early", "icon": "⛵", "title": {"fr": "Histoire : origines à 1763", "en": "History: Origins to 1763"}, "summary": {"fr": "Vikings, Cabot, Cartier, Champlain, Nouvelle-France et conquête.", "en": "Vikings, Cabot, Cartier, Champlain, New France and conquest."}, "content": {"fr": "<h2>Des origines à 1763</h2>\n<table><tr><th>Date</th><th>Événement</th></tr>\n<tr><td>Vers l’an 1000</td><td>Les Vikings atteignent Terre-Neuve; L’Anse aux Meadows.</td></tr>\n<tr><td>1497</td><td>Jean Cabot cartographie la côte atlantique pour l’Angleterre.</td></tr>\n<tr><td>1534–1542</td><td>Jacques Cartier explore le Saint-Laurent; « kanata » signifie village.</td></tr>\n<tr><td>1604</td><td>De Monts et Champlain établissent Port-Royal en Acadie.</td></tr>\n<tr><td>1608</td><td>Champlain fonde Québec.</td></tr>\n<tr><td>1670</td><td>Création de la Compagnie de la Baie d’Hudson.</td></tr>\n<tr><td>1759</td><td>Bataille des plaines d’Abraham; Wolfe et Montcalm meurent.</td></tr>\n<tr><td>1763</td><td>Proclamation royale; base des négociations de traités.</td></tr></table>\n<div class=\"memory\"><b>Mémo :</b> Cabot 1497 → Cartier 1534 → Champlain 1608 → Plaines 1759 → Proclamation 1763.</div>", "en": "<h2>Origins to 1763</h2>\n<table><tr><th>Date</th><th>Event</th></tr>\n<tr><td>About 1000</td><td>Vikings reach Newfoundland; L’Anse aux Meadows.</td></tr>\n<tr><td>1497</td><td>John Cabot maps the Atlantic coast for England.</td></tr>\n<tr><td>1534–1542</td><td>Jacques Cartier explores the St. Lawrence; “kanata” means village.</td></tr>\n<tr><td>1604</td><td>De Monts and Champlain establish Port-Royal in Acadia.</td></tr>\n<tr><td>1608</td><td>Champlain founds Quebec City.</td></tr>\n<tr><td>1670</td><td>Hudson’s Bay Company is established.</td></tr>\n<tr><td>1759</td><td>Battle of the Plains of Abraham; Wolfe and Montcalm die.</td></tr>\n<tr><td>1763</td><td>Royal Proclamation; basis for treaty negotiations.</td></tr></table>\n<div class=\"memory\"><b>Memory line:</b> Cabot 1497 → Cartier 1534 → Champlain 1608 → Plains 1759 → Proclamation 1763.</div>"}}, {"id": "1812", "icon": "🛡️", "title": {"fr": "Histoire : 1763 à 1814", "en": "History: 1763 to 1814"}, "summary": {"fr": "Acte de Québec, Loyalistes, abolition et guerre de 1812.", "en": "Quebec Act, Loyalists, abolition and War of 1812."}, "content": {"fr": "<h2>De 1763 à la guerre de 1812</h2>\n<ul><li><b>1774 – Acte de Québec :</b> liberté religieuse aux catholiques, droit civil français, droit criminel anglais.</li>\n<li><b>1776 et après :</b> plus de 40 000 Loyalistes fidèles à la Couronne s’installent au nord.</li>\n<li><b>1791 :</b> le Haut-Canada et le Bas-Canada sont créés avec des assemblées élues.</li>\n<li><b>1793 :</b> John Graves Simcoe lance l’abolition progressive au Haut-Canada.</li>\n<li><b>1807 / 1833 :</b> commerce des esclaves interdit, puis esclavage aboli dans l’Empire britannique.</li></ul>\n<h3>Guerre de 1812</h3>\n<p>Les États-Unis envahissent le Canada. Les forces britanniques, les volontaires canadiens et les Premières Nations défendent le territoire. Personnes importantes : <b>Sir Isaac Brock, Tecumseh, Charles de Salaberry et Laura Secord</b>. L’invasion échoue.</p>", "en": "<h2>1763 to the War of 1812</h2>\n<ul><li><b>1774 – Quebec Act:</b> religious freedom for Catholics, French civil law, English criminal law.</li>\n<li><b>1776 and after:</b> more than 40,000 Loyalists loyal to the Crown settle in the north.</li>\n<li><b>1791:</b> Upper Canada and Lower Canada are created with elected assemblies.</li>\n<li><b>1793:</b> John Graves Simcoe begins gradual abolition in Upper Canada.</li>\n<li><b>1807 / 1833:</b> the slave trade is banned, then slavery is abolished throughout the British Empire.</li></ul>\n<h3>War of 1812</h3>\n<p>The United States invades Canada. British forces, Canadian volunteers and First Nations defend the territory. Important people: <b>Sir Isaac Brock, Tecumseh, Charles de Salaberry and Laura Secord</b>. The invasion fails.</p>"}}, {"id": "confed", "icon": "🏛️", "title": {"fr": "Gouvernement responsable et Confédération", "en": "Responsible Government and Confederation"}, "summary": {"fr": "Rébellions, La Fontaine, Pères de la Confédération et 1867.", "en": "Rebellions, La Fontaine, Fathers of Confederation and 1867."}, "content": {"fr": "<h2>Gouvernement responsable et Confédération</h2>\n<ul><li><b>1837–1838 :</b> rébellions au Haut et au Bas-Canada.</li><li><b>1840 :</b> union en Province du Canada.</li>\n<li><b>1847–1849 :</b> gouvernement responsable.</li><li><b>1849 :</b> Louis-Hippolyte La Fontaine devient le premier chef d’un gouvernement responsable des deux Canadas.</li>\n<li><b>1er juillet 1867 :</b> Ontario, Québec, Nouveau-Brunswick et Nouvelle-Écosse forment le Dominion du Canada.</li>\n<li><b>Sir John A. Macdonald :</b> premier premier ministre.</li><li><b>Sir George-Étienne Cartier :</b> principal architecte québécois de la Confédération.</li></ul>\n<div class=\"memory\"><b>Gouvernement responsable :</b> le Cabinet doit conserver la confiance de la majorité des représentants élus. S’il perd un vote de confiance important, il doit démissionner ou demander une élection.</div>", "en": "<h2>Responsible Government and Confederation</h2>\n<ul><li><b>1837–1838:</b> rebellions in Upper and Lower Canada.</li><li><b>1840:</b> union into the Province of Canada.</li>\n<li><b>1847–1849:</b> responsible government.</li><li><b>1849:</b> Louis-Hippolyte La Fontaine becomes the first head of a responsible government for both Canadas.</li>\n<li><b>July 1, 1867:</b> Ontario, Quebec, New Brunswick and Nova Scotia form the Dominion of Canada.</li>\n<li><b>Sir John A. Macdonald:</b> first Prime Minister.</li><li><b>Sir George-Étienne Cartier:</b> leading Quebec architect of Confederation.</li></ul>\n<div class=\"memory\"><b>Responsible government:</b> Cabinet must keep the confidence of the majority of elected representatives. If it loses an important confidence vote, it must resign or request an election.</div>"}}, {"id": "west", "icon": "🚂", "title": {"fr": "Expansion vers l’Ouest", "en": "Expansion to the West"}, "summary": {"fr": "Louis Riel, Manitoba, Police montée et Canadien Pacifique.", "en": "Louis Riel, Manitoba, Mounted Police and Canadian Pacific Railway."}, "content": {"fr": "<h2>Expansion et construction du pays</h2>\n<ul><li><b>1869–1870 :</b> Louis Riel dirige la résistance de la rivière Rouge; création du Manitoba en 1870.</li>\n<li><b>1871 :</b> la Colombie-Britannique entre dans le Canada après la promesse d’un chemin de fer.</li>\n<li><b>1873 :</b> création de la Police à cheval du Nord-Ouest, ancêtre de la GRC.</li>\n<li><b>1885 :</b> seconde résistance métisse et exécution de Riel.</li>\n<li><b>7 novembre 1885 :</b> Donald Smith pose le dernier crampon du Canadien Pacifique.</li></ul>\n<p>Le chemin de fer relie le pays d’un océan à l’autre. Des travailleurs chinois ont joué un rôle essentiel dans sa construction et ont ensuite subi de la discrimination.</p>\n<h3>Entrées dans le Canada</h3>\n<p>1867 : ON, QC, NB, NS • 1870 : Manitoba • 1871 : C.-B. • 1873 : Î.-P.-É. • 1905 : Alberta et Saskatchewan • 1949 : Terre-Neuve-et-Labrador • 1999 : Nunavut.</p>", "en": "<h2>Expansion and Building the Country</h2>\n<ul><li><b>1869–1870:</b> Louis Riel leads the Red River Resistance; Manitoba is created in 1870.</li>\n<li><b>1871:</b> British Columbia joins Canada after being promised a railway.</li>\n<li><b>1873:</b> North-West Mounted Police, predecessor of the RCMP, is created.</li>\n<li><b>1885:</b> second Métis resistance and execution of Riel.</li>\n<li><b>November 7, 1885:</b> Donald Smith drives the last spike of the Canadian Pacific Railway.</li></ul>\n<p>The railway links the country from sea to sea. Chinese workers played an essential role in its construction and later faced discrimination.</p>\n<h3>Joining Canada</h3>\n<p>1867: ON, QC, NB, NS • 1870: Manitoba • 1871: B.C. • 1873: P.E.I. • 1905: Alberta and Saskatchewan • 1949: Newfoundland and Labrador • 1999: Nunavut.</p>"}}, {"id": "wars", "icon": "🌺", "title": {"fr": "Guerres mondiales, vote et mémoire", "en": "World Wars, Voting and Remembrance"}, "summary": {"fr": "Vimy, jour du Souvenir, droit de vote des femmes et Juno Beach.", "en": "Vimy, Remembrance Day, women’s vote and Juno Beach."}, "content": {"fr": "<h2>Guerres, vote et mémoire</h2>\n<h3>Première Guerre mondiale</h3><ul><li>1914–1918; plus de 600 000 Canadiens servent.</li><li>Crête de Vimy, avril 1917 : victoire majeure et symbole d’identité nationale.</li><li>Sir Arthur Currie dirige le Corps canadien durant les Cent-Jours.</li></ul>\n<h3>Droit de vote des femmes</h3><ul><li>Emily Stowe : pionnière des suffragettes.</li><li>Manitoba, 1916 : première province à accorder le vote aux femmes.</li><li>1918 : la plupart des Canadiennes adultes obtiennent le vote fédéral.</li><li>Agnes Macphail, 1921 : première femme députée fédérale.</li></ul>\n<h3>Seconde Guerre mondiale</h3><ul><li>1939–1945.</li><li>Juno Beach, 6 juin 1944 : participation canadienne au débarquement de Normandie.</li><li>La Marine royale du Canada protège les convois dans la bataille de l’Atlantique.</li><li>Le Canada contribue à la libération des Pays-Bas.</li></ul>\n<div class=\"memory\"><b>11 novembre :</b> coquelicot et moment de silence pour honorer les personnes qui ont servi ou sont mortes à la guerre.</div>", "en": "<h2>Wars, Voting and Remembrance</h2>\n<h3>First World War</h3><ul><li>1914–1918; more than 600,000 Canadians serve.</li><li>Vimy Ridge, April 1917: major victory and symbol of national identity.</li><li>Sir Arthur Currie commands the Canadian Corps during the Hundred Days.</li></ul>\n<h3>Women’s right to vote</h3><ul><li>Emily Stowe: pioneer of the suffrage movement.</li><li>Manitoba, 1916: first province to grant women the vote.</li><li>1918: most adult Canadian women obtain the federal vote.</li><li>Agnes Macphail, 1921: first woman elected to the House of Commons.</li></ul>\n<h3>Second World War</h3><ul><li>1939–1945.</li><li>Juno Beach, June 6, 1944: Canadian participation in the Normandy landings.</li><li>The Royal Canadian Navy protects convoys in the Battle of the Atlantic.</li><li>Canada helps liberate the Netherlands.</li></ul>\n<div class=\"memory\"><b>November 11:</b> poppy and moment of silence to honour those who served or died in war.</div>"}}, {"id": "modern", "icon": "🛰️", "title": {"fr": "Canada moderne et contributions", "en": "Modern Canada and Contributions"}, "summary": {"fr": "Langues officielles, Charte, organismes internationaux, arts, sports et inventions.", "en": "Official languages, Charter, international organizations, arts, sports and inventions."}, "content": {"fr": "<h2>Canada moderne</h2>\n<ul><li><b>1969 :</b> Loi sur les langues officielles.</li><li><b>1982 :</b> Constitution modifiée pour inclure la Charte canadienne des droits et libertés.</li><li><b>1980 et 1995 :</b> référendums sur la souveraineté du Québec, rejetée les deux fois.</li><li>Canada membre de l’ONU et de l’OTAN; NORAD avec les États-Unis.</li></ul>\n<h3>Contributions à reconnaître</h3>\n<table><tr><th>Personne</th><th>Contribution</th></tr>\n<tr><td>Banting et Best</td><td>Insuline</td></tr><tr><td>James Naismith</td><td>Basketball</td></tr>\n<tr><td>Terry Fox</td><td>Marathon de l’espoir</td></tr><tr><td>Rick Hansen</td><td>Tour du monde en fauteuil roulant</td></tr>\n<tr><td>Sandford Fleming</td><td>Fuseaux horaires</td></tr><tr><td>Joseph-Armand Bombardier</td><td>Motoneige</td></tr>\n<tr><td>SPAR/CNR</td><td>Canadarm</td></tr><tr><td>Groupe des Sept</td><td>Peinture de paysages canadiens</td></tr></table>\n<p>Sports nationaux : hockey sur glace en hiver, crosse en été.</p>", "en": "<h2>Modern Canada</h2>\n<ul><li><b>1969:</b> Official Languages Act.</li><li><b>1982:</b> Constitution amended to include the Canadian Charter of Rights and Freedoms.</li><li><b>1980 and 1995:</b> Quebec sovereignty referendums, defeated both times.</li><li>Canada is a member of the UN and NATO; NORAD with the United States.</li></ul>\n<h3>Contributions to recognize</h3>\n<table><tr><th>Person</th><th>Contribution</th></tr>\n<tr><td>Banting and Best</td><td>Insulin</td></tr><tr><td>James Naismith</td><td>Basketball</td></tr>\n<tr><td>Terry Fox</td><td>Marathon of Hope</td></tr><tr><td>Rick Hansen</td><td>Wheelchair world tour</td></tr>\n<tr><td>Sandford Fleming</td><td>Time zones</td></tr><tr><td>Joseph-Armand Bombardier</td><td>Snowmobile</td></tr>\n<tr><td>SPAR/NRC</td><td>Canadarm</td></tr><tr><td>Group of Seven</td><td>Canadian landscape painting</td></tr></table>\n<p>National sports: ice hockey in winter, lacrosse in summer.</p>"}}, {"id": "government", "icon": "👑", "title": {"fr": "Système de gouvernement", "en": "System of Government"}, "summary": {"fr": "État fédéral, démocratie parlementaire, monarchie constitutionnelle et trois pouvoirs.", "en": "Federal state, parliamentary democracy, constitutional monarchy and three branches."}, "content": {"fr": "<h2>Le système de gouvernement</h2>\n<div class=\"memory\"><b>Phrase à réciter :</b> Le Canada est un État fédéral, une démocratie parlementaire et une monarchie constitutionnelle.</div>\n<ul><li><b>Chef d’État :</b> le Roi, représenté au fédéral par la gouverneure générale.</li><li><b>Chef du gouvernement :</b> le premier ministre.</li><li><b>Dans les provinces :</b> lieutenant-gouverneur et premier ministre provincial.</li><li><b>Dans les territoires :</b> commissaire et premier ministre territorial.</li></ul>\n<h3>Trois pouvoirs</h3><ul><li><b>Exécutif :</b> met en œuvre les lois; premier ministre et Cabinet.</li><li><b>Législatif :</b> débat et adopte les lois; Parlement.</li><li><b>Judiciaire :</b> interprète les lois; tribunaux indépendants.</li></ul>\n<h3>Parlement du Canada</h3><p>Le Parlement comprend le <b>souverain, le Sénat et la Chambre des communes</b>. Les députés sont élus. Les sénateurs sont nommés par la gouverneure générale sur recommandation du premier ministre et prennent leur retraite à 75 ans.</p>", "en": "<h2>System of Government</h2>\n<div class=\"memory\"><b>Sentence to recite:</b> Canada is a federal state, a parliamentary democracy and a constitutional monarchy.</div>\n<ul><li><b>Head of state:</b> the King, represented federally by the Governor General.</li><li><b>Head of government:</b> the Prime Minister.</li><li><b>In provinces:</b> Lieutenant Governor and provincial Premier.</li><li><b>In territories:</b> Commissioner and territorial Premier.</li></ul>\n<h3>Three branches</h3><ul><li><b>Executive:</b> implements laws; Prime Minister and Cabinet.</li><li><b>Legislative:</b> debates and passes laws; Parliament.</li><li><b>Judicial:</b> interprets laws; independent courts.</li></ul>\n<h3>Parliament of Canada</h3><p>Parliament includes the <b>Sovereign, the Senate and the House of Commons</b>. MPs are elected. Senators are appointed by the Governor General on the advice of the Prime Minister and retire at age 75.</p>"}}, {"id": "levels", "icon": "🏙️", "title": {"fr": "Fédéral, provincial et municipal", "en": "Federal, Provincial and Municipal"}, "summary": {"fr": "Répartition des responsabilités et processus législatif.", "en": "Division of responsibilities and the law-making process."}, "content": {"fr": "<h2>Qui fait quoi?</h2>\n<table><tr><th>Ordre</th><th>Responsabilités typiques</th></tr>\n<tr><td>Fédéral</td><td>Défense, politique étrangère, citoyenneté, monnaie, droit criminel, commerce international/interprovincial</td></tr>\n<tr><td>Provincial</td><td>Éducation, santé, ressources naturelles, autoroutes, municipalités, propriété et droits civils</td></tr>\n<tr><td>Municipal</td><td>Rues locales, eau, déchets, transport local, incendies, loisirs, urbanisme</td></tr>\n<tr><td>Partagé</td><td>Immigration, agriculture et environnement</td></tr></table>\n<h3>Comment un projet devient une loi</h3><p>Première lecture → deuxième lecture → comité → rapport → troisième lecture → Sénat → sanction royale.</p>\n<div class=\"memory\"><b>Mémo :</b> Fédéral = frontières/politique étrangère/monnaie; Province = propriété/santé/éducation; Municipal = routes/déchets/transport local.</div>", "en": "<h2>Who Does What?</h2>\n<table><tr><th>Level</th><th>Typical responsibilities</th></tr>\n<tr><td>Federal</td><td>Defence, foreign policy, citizenship, currency, criminal law, international/interprovincial trade</td></tr>\n<tr><td>Provincial</td><td>Education, health, natural resources, highways, municipalities, property and civil rights</td></tr>\n<tr><td>Municipal</td><td>Local streets, water, waste, local transit, fire protection, recreation, planning</td></tr>\n<tr><td>Shared</td><td>Immigration, agriculture and environment</td></tr></table>\n<h3>How a bill becomes law</h3><p>First reading → second reading → committee → report stage → third reading → Senate → Royal Assent.</p>\n<div class=\"memory\"><b>Memory:</b> Federal = frontiers/foreign affairs/money; Province = property/health/education; Municipal = roads/waste/local transit.</div>"}}, {"id": "elections", "icon": "🗳️", "title": {"fr": "Élections et vote", "en": "Elections and Voting"}, "summary": {"fr": "Admissibilité, vote secret, circonscriptions et majorité/minorité.", "en": "Eligibility, secret ballot, electoral districts and majority/minority."}, "content": {"fr": "<h2>Élections fédérales</h2>\n<h3>Pour voter</h3><p>Il faut être citoyen canadien, avoir au moins 18 ans le jour du vote et être inscrit sur la liste électorale.</p>\n<ul><li><b>Circonscription :</b> zone géographique représentée par un député.</li><li><b>Vote secret :</b> personne ne peut exiger de connaître ton choix.</li><li><b>Élections Canada :</b> organisme indépendant et neutre qui administre les élections fédérales.</li><li>Le candidat ayant le plus de votes gagne; il n’a pas besoin de dépasser 50 %.</li></ul>\n<h3>Après l’élection</h3><p>Habituellement, le chef du parti ayant le plus de sièges est invité à former le gouvernement. Un gouvernement est <b>majoritaire</b> s’il détient au moins la moitié des sièges; sinon, il est <b>minoritaire</b>.</p>\n<p>L’opposition officielle est le parti d’opposition ayant le plus de sièges.</p>", "en": "<h2>Federal Elections</h2>\n<h3>To vote</h3><p>You must be a Canadian citizen, be at least 18 on election day and be registered on the voters’ list.</p>\n<ul><li><b>Electoral district:</b> geographic area represented by an MP.</li><li><b>Secret ballot:</b> no one can require you to reveal your choice.</li><li><b>Elections Canada:</b> independent, neutral agency that administers federal elections.</li><li>The candidate with the most votes wins; more than 50% is not required.</li></ul>\n<h3>After the election</h3><p>Usually, the leader of the party with the most seats is invited to form government. A government is <b>majority</b> if it holds at least half the seats; otherwise it is <b>minority</b>.</p>\n<p>The Official Opposition is the opposition party with the most seats.</p>"}}, {"id": "justice", "icon": "⚖️", "title": {"fr": "Système de justice", "en": "Justice System"}, "summary": {"fr": "Primauté du droit, présomption d’innocence, tribunaux et police.", "en": "Rule of law, presumption of innocence, courts and police."}, "content": {"fr": "<h2>Le système de justice</h2>\n<ul><li><b>Primauté du droit :</b> la loi s’applique à tous.</li><li><b>Application régulière de la loi :</b> le gouvernement doit respecter les garanties juridiques.</li><li><b>Présomption d’innocence :</b> innocent jusqu’à preuve du contraire.</li><li><b>Justice impartiale :</b> décisions fondées sur les faits et la loi.</li></ul>\n<h3>Tribunaux</h3><p>La Cour suprême du Canada est le plus haut tribunal. La Cour fédérale traite les questions relevant du gouvernement fédéral. Les provinces ont des cours d’appel, des cours supérieures et divers tribunaux spécialisés.</p>\n<h3>Police</h3><p>La GRC applique les lois fédérales partout au Canada et sert de police provinciale dans toutes les provinces sauf l’Ontario et le Québec. Ces deux provinces ont leur propre police provinciale.</p>", "en": "<h2>Justice System</h2>\n<ul><li><b>Rule of law:</b> the law applies to everyone.</li><li><b>Due process:</b> government must respect legal protections.</li><li><b>Presumption of innocence:</b> innocent until proven guilty.</li><li><b>Impartial justice:</b> decisions are based on facts and law.</li></ul>\n<h3>Courts</h3><p>The Supreme Court of Canada is the highest court. The Federal Court handles matters involving the federal government. Provinces have courts of appeal, superior courts and specialized courts.</p>\n<h3>Police</h3><p>The RCMP enforces federal laws across Canada and provides provincial policing in every province except Ontario and Quebec. Those two provinces have their own provincial police forces.</p>"}}, {"id": "symbols", "icon": "🍁", "title": {"fr": "Symboles et dates nationales", "en": "Symbols and National Dates"}, "summary": {"fr": "Couronne, drapeau, devise, hymne, castor, coquelicot et distinctions.", "en": "Crown, flag, motto, anthem, beaver, poppy and honours."}, "content": {"fr": "<h2>Symboles canadiens</h2>\n<table><tr><th>Symbole</th><th>Fait essentiel</th></tr>\n<tr><td>Drapeau</td><td>Hissé pour la première fois en 1965</td></tr><tr><td>Feuille d’érable</td><td>Symbole canadien reconnu; utilisé par les militaires depuis les années 1850</td></tr>\n<tr><td>Devise</td><td><i>A mari usque ad mare</i> = « d’un océan à l’autre »</td></tr><tr><td>Ô Canada</td><td>Hymne national depuis 1980; chanté pour la première fois en 1880</td></tr>\n<tr><td>Castor</td><td>Lié à la traite des fourrures; pièce de 5 cents</td></tr><tr><td>Ordre du Canada</td><td>Créé en 1967</td></tr><tr><td>Croix de Victoria</td><td>Plus haute distinction pour bravoure face à l’ennemi</td></tr></table>\n<h3>Dates</h3><p>9 avril : Jour de Vimy • 1er juillet : Fête du Canada • 11 novembre : jour du Souvenir • 24 juin : Fête nationale du Québec.</p>", "en": "<h2>Canadian Symbols</h2>\n<table><tr><th>Symbol</th><th>Key fact</th></tr>\n<tr><td>Flag</td><td>First raised in 1965</td></tr><tr><td>Maple leaf</td><td>Recognized Canadian symbol; used by the military since the 1850s</td></tr>\n<tr><td>Motto</td><td><i>A mari usque ad mare</i> = “from sea to sea”</td></tr><tr><td>O Canada</td><td>National anthem since 1980; first sung in 1880</td></tr>\n<tr><td>Beaver</td><td>Linked to the fur trade; appears on the five-cent coin</td></tr><tr><td>Order of Canada</td><td>Created in 1967</td></tr><tr><td>Victoria Cross</td><td>Highest honour for valour in the face of the enemy</td></tr></table>\n<h3>Dates</h3><p>April 9: Vimy Day • July 1: Canada Day • November 11: Remembrance Day • June 24: Quebec’s national holiday.</p>"}}, {"id": "economy", "icon": "🏗️", "title": {"fr": "Économie canadienne", "en": "Canadian Economy"}, "summary": {"fr": "Commerce, services, fabrication et ressources naturelles.", "en": "Trade, services, manufacturing and natural resources."}, "content": {"fr": "<h2>L’économie canadienne</h2>\n<p>Le Canada est une nation commerçante. Les États-Unis sont son plus important partenaire commercial international.</p>\n<h3>Trois grands secteurs</h3><ul><li><b>Services :</b> transport, éducation, santé, banques, tourisme, administration.</li><li><b>Manufacturier :</b> papier, technologie, aérospatiale, automobiles, aliments et vêtements.</li><li><b>Ressources naturelles :</b> foresterie, pêche, agriculture, mines, pétrole, gaz et hydroélectricité.</li></ul>\n<h3>Associations régionales</h3><p>Atlantique : pêche et ressources marines • Centre : fabrication, finance et hydroélectricité • Prairies : agriculture, pétrole, gaz, potasse et uranium • C.-B. : foresterie, port, mines, pêche, vergers et vin • Nord : mines, diamants et art inuit.</p>", "en": "<h2>Canadian Economy</h2>\n<p>Canada is a trading nation. The United States is Canada’s most important international trading partner.</p>\n<h3>Three main sectors</h3><ul><li><b>Services:</b> transportation, education, health care, banking, tourism, government.</li><li><b>Manufacturing:</b> paper, technology, aerospace, automobiles, food and clothing.</li><li><b>Natural resources:</b> forestry, fishing, agriculture, mining, oil, gas and hydroelectricity.</li></ul>\n<h3>Regional associations</h3><p>Atlantic: fishing and marine resources • Central: manufacturing, finance and hydroelectricity • Prairies: agriculture, oil, gas, potash and uranium • B.C.: forestry, port, mining, fishing, orchards and wine • North: mining, diamonds and Inuit art.</p>"}}, {"id": "geography", "icon": "🗺️", "title": {"fr": "Géographie, provinces et capitales", "en": "Geography, Provinces and Capitals"}, "summary": {"fr": "Cinq régions, trois océans, dix provinces et trois territoires.", "en": "Five regions, three oceans, ten provinces and three territories."}, "content": {"fr": "<h2>Géographie du Canada</h2>\n<ul><li>Deuxième plus grand pays du monde par superficie.</li><li>Pacifique à l’ouest, Atlantique à l’est, Arctique au nord.</li><li>10 provinces et 3 territoires.</li><li>Capitale du Canada : Ottawa, choisie par la reine Victoria en 1857.</li><li>Cinq régions : Atlantique, Centre, Prairies, Côte Ouest et Nord.</li></ul>\n<div id=\"capitalTableFr\"></div>\n<div class=\"memory\"><b>À ne pas confondre :</b> Ottawa = Canada; Toronto = Ontario; Victoria = Colombie-Britannique.</div>", "en": "<h2>Geography of Canada</h2>\n<ul><li>Second-largest country in the world by area.</li><li>Pacific Ocean to the west, Atlantic to the east, Arctic to the north.</li><li>10 provinces and 3 territories.</li><li>Capital of Canada: Ottawa, chosen by Queen Victoria in 1857.</li><li>Five regions: Atlantic, Central, Prairies, West Coast and North.</li></ul>\n<div id=\"capitalTableEn\"></div>\n<div class=\"memory\"><b>Do not confuse:</b> Ottawa = Canada; Toronto = Ontario; Victoria = British Columbia.</div>"}}, {"id": "bc", "icon": "🌲", "title": {"fr": "Focus Colombie-Britannique et Vancouver", "en": "British Columbia and Vancouver Focus"}, "summary": {"fr": "Capitales, économie, histoire et représentants à revérifier.", "en": "Capitals, economy, history and representatives to recheck."}, "content": {"fr": "<h2>Colombie-Britannique et Vancouver</h2>\n<ul><li>Capitale : <b>Victoria</b>.</li><li>Entre dans la Confédération en <b>1871</b> avec la promesse d’un chemin de fer.</li><li>Province la plus à l’ouest; océan Pacifique.</li><li>Économie : port de Vancouver, foresterie, mines, pêche, vergers et vins de l’Okanagan.</li></ul>\n<h3>Faits actuels vérifiés le 5 août 2026</h3>\n<ul><li>Roi du Canada : Charles III.</li><li>Gouverneure générale : Louise Arbour.</li><li>Premier ministre du Canada : Mark Carney.</li><li>Lieutenante-gouverneure de la C.-B. : Wendy Cocchia.</li><li>Premier ministre de la C.-B. : David Eby.</li><li>Maire de Vancouver : Ken Sim.</li><li>Députée de Vancouver-Centre : Hedy Fry.</li></ul>\n<div class=\"warning\"><b>Information dynamique :</b> vérifie de nouveau les noms actuels dans les 48 heures avant l’examen.</div>", "en": "<h2>British Columbia and Vancouver</h2>\n<ul><li>Capital: <b>Victoria</b>.</li><li>Joins Confederation in <b>1871</b> with the promise of a railway.</li><li>Westernmost pro function shuffle(items) {
  const out = [...items];
  for (let i=out.length-1; i>0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function historyCorrect(){return ["early","1812","confed","west","wars","modern"].reduce((s,k)=>s+Number(state.topicCorrect[k]||0),0)}
function currentLevel(){let result=LEVELS[0];for(const level of LEVELS){if(state.xp>=level.xp)result=level}return result}
function nextLevel(){return LEVELS.find(level=>level.xp>state.xp)||null}
function levelName(){const level=currentLevel();return lang==="fr"?level.fr:level.en}
function addXP(amount,reason=""){
  if(!Number.isFinite(amount)||amount<=0)return;
  const oldLevel=currentLevel();
  state.xp+=amount;
  const newLevel=currentLevel();
  saveState();
  showRewardToast(`+${amount} XP${reason?` • ${reason}`:""}`);
  if(oldLevel.xp!==newLevel.xp)setTimeout(()=>showRewardToast(`🎉 ${lang==="fr"?"Niveau":"Level"}: ${levelName()}`),700);
  updateBadges();
}
function registerAnswer(q,correct){
  state.answeredCount++;
  state.topicAnswered[q.topic]=Number(state.topicAnswered[q.topic]||0)+1;
  if(correct){
    state.correctCount++;
    state.topicCorrect[q.topic]=Number(state.topicCorrect[q.topic]||0)+1;
    state.streak++;
    state.bestStreak=Math.max(state.bestStreak,state.streak);
    addXP(state.streak>0&&state.streak%5===0?25:10,state.streak%5===0?(lang==="fr"?`Série de ${state.streak}`:`${state.streak} streak`):"");
  }else{
    state.streak=0;
    saveState();
    updateBadges();
  }
}
function updateBadges(){
  let newBadge=null;
  for(const def of BADGE_DEFS){
    if(def.test()&&!state.badges.includes(def.id)){state.badges.push(def.id);newBadge=def;}
  }
  saveState();
  if(newBadge)setTimeout(()=>showRewardToast(`${newBadge.icon} ${lang==="fr"?"Badge débloqué":"Badge unlocked"}: ${lang==="fr"?newBadge.fr:newBadge.en}`),350);
}
function syncBadgesSilently(){
  for(const def of BADGE_DEFS){
    if(def.test()&&!state.badges.includes(def.id))state.badges.push(def.id);
  }
  saveState();
}
function readiness(){
  const lessonPart=(state.completed.length/DATA.lessons.length)*35;
  const accuracy=state.answeredCount?state.correctCount/state.answeredCount:0;
  const accuracyPart=accuracy*30;
  const examPart=Math.min(state.best/20,1)*25;
  const consistency=Math.min(state.history.filter(x=>x.score>=18).length/2,1)*10;
  return Math.round(Math.min(100,lessonPart+accuracyPart+examPart+consistency));
}

function renderNav() {
  const nav = $("#nav");

  const items = [
    ["dashboard","🏠"],["learn","📚"],["practice","🎯"],
    ["mistakes","🔁"],["exam","⏱️"],["rewards","🏆"],["about","ℹ️"]
  ];
  for (const [page, icon] of items) {
    const b = button("", page === currentPage ? "nav-btn active" : "nav-btn");
    const iconSpan = document.createElement("span");
    iconSpan.className = "nav-icon";
    iconSpan.textContent = icon;
    iconSpan.setAttribute("aria-hidden", "true");

    const labelSpan = document.createElement("span");
    labelSpan.className = "nav-label";
    labelSpan.textContent = t(page);

    b.setAttribute("aria-label", t(page));
    b.append(iconSpan, labelSpan);
    b.addEventListener("click", () => navigate(page));
    nav.appendChild(b);
  }
}
function navigate(page) {
  clearExamTimer();
  currentPage = page;
  renderNav();
  if (page === "dashboard") renderDashboard();
  else if (page === "learn") renderLearn();
  else if (page === "practice") renderPractice();
  else if (page === "mistakes") renderMistakes();
  else if (page === "exam") renderExamHome();
  else if (page === "rewards") renderRewards();

}

function buildExam() {
  const chosen = [];
  const used = new Set();
  let tfCount = 0;
  let dynamicCount = 0;
  const topics = shuffle(DATA.lessons.map(l => l.id));

  for (const topic of topics) {
    const pool = shuffle(DATA.questions.filter(q =>
      q.topic === topic &&
      !used.has(q.id) &&
      (q.format !== "tf" || tfCount < 5) &&
      (!q.dynamic || dynamicCount < 1)
    ));
    const candidate = pool[0];
    if (candidate) {
      chosen.push(candidate);
      used.add(candidate.id);
      if (candidate.format === "tf") tfCount++;
      if (candidate.dynamic) dynamicCount++;
    }
  }

  const remaining = shuffle(DATA.questions.filter(q => !used.has(q.id)));
  for (const q of remaining) {
    if (chosen.length >= 20) break;
    if (q.format === "tf" && tfCount >= 5) continue;
    if (q.dynamic && dynamicCount >= 1) continue;
    chosen.push(q);
    used.add(q.id);
    if (q.format === "tf") tfCount++;
    if (q.dynamic) dynamicCount++;
  }
  return shuffle(chosen).slice(0, 20);
}

}

function submitExam() {
  const s = examSession;
  if (!s || s.submitted) return;
  s.submitted = true;
  clearExamTimer();
  const score = s.questions.reduce((sum,q,i) => sum + (s.answers[i]===q.a ? 1 : 0),0);
  state.attempts++;
  state.best = Math.max(state.best,score);
  state.history.push({date:new Date().toISOString(),score});
  s.questions.forEach((q,i) => {
    const selected=s.answers[i];
    const correct=selected===q.a;
    if(selected!==null){
      state.answeredCount++;
      state.topicAnswered[q.topic]=Number(state.topicAnswered[q.topic]||0)+1;
      if(correct){state.correctCount++;state.topicCorrect[q.topic]=Number(state.topicCorrect[q.topic]||0)+1;}
    }
    if(!correct)recordWrong(q);
  });
  const examXP=score*10+(score>=15?100:0)+(score>=18?50:0)+(score===20?100:0);
  addXP(examXP,lang==="fr"?"Examen blanc":"Mock exam");
  updateBadges();
  saveState();
  renderExamResults(score);
}
